name: Post News
on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install feedparser requests beautifulsoup4 googlenewsdecoder
      - run: python post_news.py
        env:
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_TOKEN: ${{ secrets.FB_TOKEN }}
      - run: |
          git config user.name "bot"; git config user.email "bot@example.com"
          git add posted.json && git commit -m "update" && git push || true
